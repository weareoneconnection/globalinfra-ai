name: ci
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r services/api/requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall services/api/app
      - run: python -m pytest services/api/tests -q
      - run: python evals/run_eval.py
      - run: python evals/run_intake_eval.py
      - run: python evals/run_competition_eval.py
      - run: python evals/run_agent_org_eval.py
      # Alembic migrations must apply cleanly to a bare database and produce the
      # same schema the app's create_all path does (V1.3 M1 introduced them).
      - name: Alembic upgrade on a bare database
        working-directory: services/api
        env:
          DATABASE_URL: sqlite:////tmp/ci_migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
        env:
          API_INTERNAL_URL: http://localhost:8000
  docker-compose-smoke-test:
    # Boots the full stack the way a real deployment (and README "Quick
    # start: Docker") does, instead of only unit-testing the API and
    # building the web app in isolation. Catches breakage in docker-compose.yml,
    # the Dockerfiles and inter-service wiring that the two jobs above cannot see.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Smoke-test API and web
        run: |
          set -e
          curl -sf http://localhost:8001/health
          curl -sf http://localhost:8001/readyz | grep -q '"database":"ok"'
          curl -sf http://localhost:8001/metrics | grep -q 'globalinfra_http_requests_total'
          curl -sf http://localhost:8001/platform/capabilities | grep -q 'PHASE_10_1_UNIFIED_INGESTION'
          curl -sf http://localhost:8001/projects | grep -q 'MY-RAIL-A'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8001/cases/classify \
            -H 'Content-Type: application/json' \
            -d '{"text":"Worker observed near unprotected edge at elevated workface."}')
          test "$code" = "200"
          # V1.3 M1 universal intake: text -> new case -> specialist routing.
          # M2/M3/M4: the IntakeResult reports which classification / extraction
          # layer decided; offline (no key) both must be the deterministic rules,
          # and the deterministic deadline (M4 field) must still be extracted.
          intake=$(curl -sf -X POST http://localhost:8001/intake/text \
            -H 'Content-Type: application/json' \
            -d '{"text":"Owner notice: access road damage, rectification required within 48 hours."}')
          echo "$intake" | grep -q 'CASE-INTAKE-'
          echo "$intake" | grep -q '"classification_method": *"rules"'
          echo "$intake" | grep -q '"extraction_method": *"rules"'
          echo "$intake" | grep -q '"deadline": *"48 hours"'
          # Document intake (TXT text extraction).
          printf 'Worker near unprotected edge at elevated workface, no fall protection.' > /tmp/intake.txt
          curl -sf -X POST http://localhost:8001/intake/document \
            -F 'file=@/tmp/intake.txt;type=text/plain' | grep -q 'HSE'
          # V2.0 Phase 6 digital twin: spatial identity, 4D/5D and governed
          # scenario execution must all survive the deployed service boundary.
          curl -sf 'http://localhost:8001/twin/summary?project_id=1' | grep -q 'PHASE_6'
          curl -sf 'http://localhost:8001/twin/scene?project_id=1' | grep -q 'TWIN-MYRAIL-V12-P47'
          curl -sf 'http://localhost:8001/twin/model-versions?project_id=1' | grep -q '2026.10-A'
          curl -sf 'http://localhost:8001/twin/telemetry/live/1?events=1' | grep -q 'event: telemetry'
          curl -sf 'http://localhost:8001/twin/showcase/1' | grep -q 'Grounded Copilot'
          curl -sf 'http://localhost:8001/competition/evaluation' | grep -q 'AI_OUTBOUND_COMPETITION_EVIDENCE'
          curl -sf 'http://localhost:8001/competition/golden-thread' | grep -q 'CASE-GOLDEN-MY-001'
          curl -sf -X POST 'http://localhost:8001/twin/scenarios/SCN-RECOVERY-V12/run' \
            -H 'Content-Type: application/json' -d '{"adjustment_percent":10}' | grep -q 'AWAITING_APPROVAL'
          curl -sf http://localhost:3000/ > /dev/null
          curl -sf http://localhost:3000/overview > /dev/null
          curl -sf http://localhost:3000/twin > /dev/null
          curl -sf http://localhost:3000/twin/generate > /dev/null
          curl -sf 'http://localhost:3000/showcase?project_id=1' > /dev/null
          curl -sf http://localhost:3000/competition > /dev/null
          curl -sf http://localhost:3000/field > /dev/null
          curl -sf http://localhost:3000/integrations > /dev/null
          curl -sf http://localhost:3000/platform > /dev/null
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
