apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalinfra-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: globalinfra-api }
  template:
    metadata:
      labels: { app: globalinfra-api }
    spec:
      containers:
        - name: api
          image: globalinfra/api:1.0.0
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: globalinfra-api-secrets }
---
apiVersion: v1
kind: Service
metadata:
  name: globalinfra-api
spec:
  selector: { app: globalinfra-api }
  ports:
    - port: 80
      targetPort: 8000
