apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalinfra-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: globalinfra-web }
  template:
    metadata:
      labels: { app: globalinfra-web }
    spec:
      containers:
        - name: web
          image: globalinfra/web:1.0.0
          ports: [{ containerPort: 3000 }]
          env:
            - name: API_INTERNAL_URL
              value: http://globalinfra-api
            - name: API_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: globalinfra-api-secrets
                  key: API_KEY
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: globalinfra-web
spec:
  selector: { app: globalinfra-web }
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: globalinfra-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: globalinfra-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
