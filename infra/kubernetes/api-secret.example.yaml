# Example only — do not `kubectl apply` this file as-is.
#
# Populate real values through your secret manager (External Secrets
# Operator, Sealed Secrets, Vault, etc.) and never commit actual credentials
# to source control. `api-deployment.yaml` loads all of these into the API
# container via `envFrom.secretRef`, matching the same variables
# `docker-compose.yml`/`.env.example` use locally (see app/config.py).
apiVersion: v1
kind: Secret
metadata:
  name: globalinfra-api-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://USER:PASSWORD@HOST:5432/globalinfra"
  REDIS_URL: "redis://HOST:6379/0"
  LLM_MODE: "mock"
  OPENAI_COMPAT_BASE_URL: "https://api.openai.com/v1"
  OPENAI_COMPAT_API_KEY: ""
  OPENAI_COMPAT_MODEL: "gpt-5.6-mini"
  # Pilot-stage auth gate (see docs/SECURITY.md); not a replacement for the
  # SSO/OIDC backlog item, but the minimum needed before exposing the API
  # outside a trusted network.
  REQUIRE_API_KEY: "true"
  API_KEY: "REPLACE_ME"
  CORS_ORIGINS: "https://globalinfra.example.com"
  MAX_UPLOAD_BYTES: "10485760"
